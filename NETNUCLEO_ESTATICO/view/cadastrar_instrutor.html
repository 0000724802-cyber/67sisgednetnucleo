<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Instrutor | SISGED</title>
<link rel="stylesheet" href="../public/style.css">
<script src="../public/db.js"></script>
</head>
<body data-role="admin">
<header class="header"><div class="header-container"><a href="index.html" class="logo-area" aria-label="SISGED - Página inicial"><img src="../public/img/logo.png" alt="SESI e SENAI" class="institution-logo"><h3 class="netindex">SISGED - HORTO</h3></a><button type="button" class="menu-button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">☰</button><nav class="navigation" id="menu-principal"><a href="index.html">Início</a><a href="cadastrar_aula.html">Cadastrar aula</a><a href="cadastrar_instrutor.html" class="active">Instrutores</a><a href="usuarios.html">Gerenciar Logins</a><a href="consulta.html">Consultas</a><a href="login.html" data-logout="1">Sair</a></nav></div></header>
<main class="page-main"><div class="container">
<div class="page-title"><span class="section-label">CADASTRO</span><h1>Cadastrar instrutor</h1></div>
<div id="msg-ok" class="form-message success" style="display:none"></div>
<div id="msg-erro" class="form-message error" style="display:none"></div>
<section class="filter-card"><form id="instrutor-form">
<div class="form-group"><label for="nomeInstrutor">Nome</label><input type="text" id="nomeInstrutor" name="nomeInstrutor" required></div>
<div class="form-group"><label for="cpfInstrutor">CPF</label><input type="text" id="cpfInstrutor" name="cpfInstrutor" maxlength="11" inputmode="numeric"></div>
<div class="form-group"><label for="emailInstrutor">E-mail</label><input type="email" id="emailInstrutor" name="emailInstrutor"></div>
<div class="form-group"><label for="telefoneInstrutor">Telefone</label><input type="text" id="telefoneInstrutor" name="telefoneInstrutor" inputmode="tel"></div>
<div class="form-group"><label for="areaInstrutor">Área</label><input type="text" id="areaInstrutor" name="areaInstrutor"></div>
<div class="form-actions"><button class="button button-primary" type="submit">Salvar instrutor</button><a class="button button-secondary" href="cadastrar_aula.html">Cadastrar aula</a></div>
</form></section></div></main>
<script src="../public/cadastros.js"></script>
</body></html>
